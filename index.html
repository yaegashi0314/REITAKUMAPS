<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <!-- PWA -->
    <meta
        name="theme-color"
        content="#6a00d4"
    >

    <meta
        name="description"
        content="麗澤大学の木を探せるマップアプリ"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>REITAKUMAPS</title>


    <!-- PWA manifest -->

    <link
        rel="manifest"
        href="./manifest.json"
    >


    <!-- iPhone用アイコン -->

    <link
        rel="apple-touch-icon"
        href="./icons/icon-192.png"
    >


    <!-- MapLibre CSS -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
    >


    <!-- 自分のCSS -->

    <link
        rel="stylesheet"
        href="./style.css"
    >


    <!-- MapLibre JS -->

    <script
        src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"
    ></script>

</head>


<body>


    <!-- ======================================== -->
    <!-- ヘッダー -->
    <!-- ======================================== -->

    <header>

        <h1>
            REITAKUMAPS
        </h1>


        <button
            id="compassButton"
            type="button"
        >
            コンパスを有効化
        </button>

    </header>


    <!-- ======================================== -->
    <!-- マップ -->
    <!-- ======================================== -->

    <div id="map"></div>


    <!-- ======================================== -->
    <!-- アプリインストール案内 -->
    <!-- ======================================== -->

    <div
        id="installBanner"
        class="install-banner"
        hidden
    >

        <div>

            <strong>
                REITAKUMAPSをアプリとして使う
            </strong>

            <small>
                ホーム画面に追加できます
            </small>

        </div>


        <button
            id="installButton"
            type="button"
        >
            インストール
        </button>


        <button
            id="closeInstallButton"
            type="button"
            aria-label="閉じる"
        >
            ×
        </button>

    </div>


    <!-- ======================================== -->
    <!-- iPhone用案内 -->
    <!-- ======================================== -->

    <div
        id="iosHint"
        class="ios-hint"
        hidden
    >

        <strong>
            REITAKUMAPSをアプリに追加
        </strong>

        <p>
            iPhoneでは「共有」→
            「ホーム画面に追加」で
            アプリとして使えます。
        </p>


        <button
            id="closeIosHint"
            type="button"
        >
            閉じる
        </button>

    </div>


    <!-- ======================================== -->
    <!-- アプリ本体 -->
    <!-- ======================================== -->

    <script
        src="./app.js"
    ></script>


    <!-- ======================================== -->
    <!-- Service Worker -->
    <!-- ======================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./service-worker.js")

                        .then(
                            (registration) => {

                                console.log(
                                    "Service Worker registered:",
                                    registration.scope
                                );

                            }
                        )

                        .catch(
                            (error) => {

                                console.error(
                                    "Service Worker registration failed:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>


</body>

</html>
