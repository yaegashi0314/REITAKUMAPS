
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>REITAKUMAPS</title>

  <meta
    name="description"
    content="麗澤大学の木の位置を確認できるキャンパスマップ"
  >

  <meta name="theme-color" content="#6a00d4">

  <!-- PWA設定 -->
  <link rel="manifest" href="./manifest.json">

  <!-- アイコン -->
  <link
    rel="icon"
    href="./icons/icon-192.png"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  >

  <!-- MapLibre CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
  >

  <!-- アプリのCSS -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================
       ヘッダー
  ========================== -->
  <header id="appHeader">

    <div class="header-title">
      <h1>REITAKUMAPS</h1>
      <p>麗澤大学キャンパスマップ</p>
    </div>

    <button
      id="compassButton"
      type="button"
      aria-label="コンパスのオン・オフ"
      aria-pressed="false"
      title="コンパス"
    >
      <span aria-hidden="true">🧭</span>
    </button>

  </header>


  <!-- =========================
       地図の種類・カメラ切り替え
  ========================== -->
  <nav id="mapModeBar" aria-label="表示モード">

    <button
      id="photoModeButton"
      class="map-mode-button active"
      type="button"
      aria-pressed="true"
    >
      航空写真
    </button>

    <button
      id="normalModeButton"
      class="map-mode-button"
      type="button"
      aria-pressed="false"
    >
      通常地図
    </button>

    <button
      id="cameraOpenButton"
      class="map-mode-button"
      type="button"
      aria-pressed="false"
    >
      カメラ
    </button>

  </nav>


  <!-- =========================
       地図画面
  ========================== -->
  <main id="mapContainer">

    <div
      id="map"
      role="application"
      aria-label="麗澤大学のキャンパスマップ"
    ></div>

  </main>


  <!-- =========================
       カメラ・樹木認識画面
  ========================== -->
  <section
    id="cameraScreen"
    aria-label="樹木認識カメラ"
    hidden
  >

    <!-- カメラ画面ヘッダー -->
    <header class="camera-header">

      <button
        id="cameraCloseButton"
        type="button"
        aria-label="地図に戻る"
      >
        ← 地図に戻る
      </button>

      <h2>木の認識カメラ</h2>

    </header>


    <!-- カメラ映像 -->
    <div id="cameraView">

      <video
        id="cameraVideo"
        autoplay
        playsinline
        muted
      ></video>

      <!-- 認識結果の枠を描画する場所 -->
      <canvas
        id="cameraOverlay"
        aria-hidden="true"
      ></canvas>

      <!-- カメラへの案内 -->
      <div id="cameraGuide">
        木にカメラを向けてください
      </div>

    </div>


    <!-- 認識した木の情報 -->
    <div
      id="cameraInfo"
      aria-live="polite"
      aria-atomic="true"
    >

      <strong id="recognizedTreeName">
        木を認識していません
      </strong>

      <p id="recognizedTreeDescription">
        木をカメラに映してください。
      </p>

    </div>

  </section>


  <!-- =========================
       アプリのインストール案内
  ========================== -->
  <section id="installBanner" hidden>

    <div class="install-banner-content">

      <div>
        <strong>REITAKUMAPSをインストール</strong>
        <p>ホーム画面からすぐに開けます。</p>
      </div>

      <div class="install-banner-actions">

        <button id="installButton" type="button">
          インストール
        </button>

        <button
          id="closeInstallButton"
          type="button"
          aria-label="インストール案内を閉じる"
        >
          閉じる
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       iPhone向けインストール案内
  ========================== -->
  <aside id="iosInstallHint" hidden>

    <strong>ホーム画面に追加する方法</strong>

    <p>
      Safariの共有メニューから
      「ホーム画面に追加」を選択してください。
    </p>

    <button id="closeIosHintButton" type="button">
      閉じる
    </button>

  </aside>


  <!-- =========================
       JavaScript
  ========================== -->

  <!-- MapLibre -->
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

  <!-- 地図・GPS・コンパス・PWA -->
  <script src="./app.js"></script>

  <!-- カメラ・樹木認識 -->
  <script src="./camera.js"></script>


  <!-- =========================
       Service Worker
  ========================== -->
  <script>
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", async function () {

        try {

          const registration =
            await navigator.serviceWorker.register("./sw.js");

          console.log(
            "Service Worker登録成功:",
            registration.scope
          );

          await registration.update();

        } catch (error) {

          console.error(
            "Service Workerの登録に失敗しました:",
            error
          );

        }

      });

    }
  </script>

</body>
</html>
